<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=https://sites.google.com/wrdsb.ca/stanleyparkhockey">
  <script>
    const redirects = {
      "/": "/Home-Page",
      "/home": "/Home-Page",
      "/homepage": "/Home-Page",
      "/sign-up": "/signup",
      "/photos": "/player-photos"
    };

    const path = window.location.pathname.toLowerCase();
    const targetPath = redirects[path] || path; // fallback: preserve same path
    const newUrl = "https://sites.google.com/wrdsb.ca/stanleyparkhockey" 
      + targetPath 
      + window.location.search 
      + window.location.hash;

    window.location.replace(newUrl);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
